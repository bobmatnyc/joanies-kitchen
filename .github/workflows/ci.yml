# #54: CI gate. typecheck and lint are ratchets; test must pass outright. No secrets are used.
# #72: the ratchet compares error LISTS (`path:code` multisets in .github/*-baseline.txt), not counts:
# a new key or a higher per-key count fails. After fixing errors, regenerate with `pnpm ci:baseline`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fails on credentialed DB URLs, npg_ tokens and private keys; prints file:line only.
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/check-secrets.mjs

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # #72: error-list ratchet (logic in .github/scripts/ratchet.mjs, fails closed on crash/parse error)
      - name: tsc --noEmit (ratchet)
        run: .github/scripts/ci-ratchet.sh check tsc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # #96 D57: the bge-small parity test skips without the pinned model, so fetch it (sha256-checked).
      - uses: actions/cache@v4
        with:
          path: models
          key: bge-small-${{ hashFiles('src/lib/ai/embedding-model.ts') }}
      - run: pnpm exec tsx scripts/fetch-embedding-model.ts
      - run: pnpm test:run

  # A37: Vercel Preview may build with no DATABASE_URL; the build must not need one.
  build-without-database-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: next build with DATABASE_URL unset
        run: |
          unset DATABASE_URL
          pnpm build
      # #96 D57: every function that loads the embedder must ship the model and linux-x64 runtime.
      - name: check embedding traces
        run: pnpm exec tsx scripts/check-embedding-traces.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # #72: error-list ratchet (logic in .github/scripts/ratchet.mjs, fails closed on crash/parse error)
      - name: biome check src (ratchet)
        run: .github/scripts/ci-ratchet.sh check biome
