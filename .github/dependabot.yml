# Dependabot version updates. Weekly, grouped minor+patch, majors ignored.
# This file does not affect security alerts.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # #295: onnxruntime-node is pinned exactly by @huggingface/transformers; bump both together by hand (a lone bump loads 2 copies, fails on Linux and pushes recipes/[slug] over 250MB, see #292).
      - dependency-name: "onnxruntime-node"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
